# CI for the pid-isolate-run packages under native/pid-isolate-run. A separate
# workflow from ci.yml keeps the native OS/architecture matrix independent of
# the harness Node matrix. Release assembly and publication use the companion
# PID Isolate Run Release workflow.
name: PID Isolate Run

on:
  pull_request:
    paths:
      - '.github/workflows/pid-isolate-run.yml'
      - '.github/workflows/pid-isolate-run-release.yml'
      - 'native/pid-isolate-run/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [master]
    paths:
      - '.github/workflows/pid-isolate-run.yml'
      - '.github/workflows/pid-isolate-run-release.yml'
      - 'native/pid-isolate-run/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

defaults:
  run:
    working-directory: native/pid-isolate-run

jobs:
  matrix:
    name: Matrix
    runs-on: ubuntu-24.04
    outputs:
      ci: ${{ steps.matrix.outputs.ci }}
    steps:
      - uses: actions/checkout@v4

      - id: matrix
        run: echo "ci=$(node ./scripts/github-matrix.mjs ci)" >> "$GITHUB_OUTPUT"

  native:
    name: ${{ matrix.platform }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.ci) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --filter @deepseek-ai/node-addon-pid-isolate-run-workspace... --frozen-lockfile

      - name: Install musl toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq musl-tools libcap2-bin

      - name: Build TypeScript
        run: pnpm build:ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Build native binaries (this architecture is the builder of record)
        run: |
          pnpm build:native
          pnpm build:test-capbset-read-fail
          pnpm build:test-drop-noop

      - name: Install launcher capabilities
        run: |
          sudo setcap cap_sys_admin,cap_setpcap+ep packages/${{ matrix.platform }}/bin/pid-isolate-run
          sudo setcap cap_sys_admin,cap_setpcap+ep test/.bin/pid-isolate-run-capbset-read-fail
          sudo setcap cap_sys_admin,cap_setpcap+ep test/.bin/pid-isolate-run-drop-noop

      - name: Entry tests (keyless)
        run: node ./test/entry.test.js

      # A self-skip on the platform that exists to prove enforcement would be
      # a false green, so an unavailable namespace capability fails the leg.
      - name: Launcher tests (real kernel enforcement)
        run: node ./test/launcher.test.js
        env:
          NPIR_REQUIRE_PID_ISOLATION: 1

      - name: Pack rehearsal (pack → install → confine, this platform only)
        run: |
          node ./scripts/pack-release.mjs .release/npm --current-platform-only
          node ./scripts/verify-packed-install.mjs .release/npm --current-platform-only

  darwin:
    name: darwin (no platform package — degradation proof)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --filter @deepseek-ai/node-addon-pid-isolate-run-workspace... --frozen-lockfile

      - name: Build TypeScript
        run: pnpm build:ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Entry tests (keyless)
        run: node ./test/entry.test.js

      - name: Launcher tests (must self-skip cleanly)
        run: node ./test/launcher.test.js

      - name: Pack rehearsal (entry only — fallback resolution + unusable probe)
        run: |
          node ./scripts/pack-release.mjs .release/npm --current-platform-only
          node ./scripts/verify-packed-install.mjs .release/npm --current-platform-only
