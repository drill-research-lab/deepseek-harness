# Local-dev overlay for `dsh web`: replace the external identity-cookie auth
# with a loopback-trusting dev auth so the UI works without the auth gateway.
# NEVER apply this in a production deployment.
#
# Run: corepack pnpm dsh web --patch dev.web.patch.yml
- id: authentication
  disabled: true
- insert:
    - id: auth-dev
      name: '@deepseek-ai/dsh-auth-dev'
